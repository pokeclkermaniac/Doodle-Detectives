<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Doodle Detectives</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Doodle Detectives">
<meta name="theme-color" content="#16130f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
body[data-theme=mugshot]{--bg:#f3efe6;--panel:#fff;--ink:#16130f;--muted:#6d655a;--accent:#f26b1d;--accent-ink:#fff;--dark:#16130f;--line:#e2dccf;--head:'Permanent Marker',cursive}
body[data-theme=noir]{--bg:#e8e8e6;--panel:#fff;--ink:#111;--muted:#666;--accent:#c62828;--accent-ink:#fff;--dark:#0b0b0b;--line:#d0d0d0;--head:'Permanent Marker',cursive}
body[data-theme=cartoon]{--bg:#fff4c7;--panel:#fff;--ink:#2a1b5a;--muted:#6b5fa0;--accent:#7b4dff;--accent-ink:#fff;--dark:#2a1b5a;--line:#eadb9c;--head:'Permanent Marker',cursive}
body[data-theme=notebook]{--bg:#fdfcf6;--panel:#fffef9;--ink:#1d2b50;--muted:#5d6b8f;--accent:#2457c5;--accent-ink:#fff;--dark:#1d2b50;--line:#cfdcf5;--head:'Patrick Hand',cursive}
@media (prefers-color-scheme:dark){
 body[data-theme=mugshot]{--bg:#121110;--panel:#1d1b19;--ink:#f3efe6;--muted:#a59d90;--dark:#000;--line:#35312c}
 body[data-theme=noir]{--bg:#0e0e0e;--panel:#1a1a1a;--ink:#eee;--muted:#999;--dark:#000;--line:#333}
 body[data-theme=cartoon]{--bg:#1a1236;--panel:#261b4d;--ink:#fff4c7;--muted:#b9acee;--dark:#0f0a24;--line:#3c2f6e}
 body[data-theme=notebook]{--bg:#141a2b;--panel:#1b2338;--ink:#e6ecff;--muted:#9aa7cc;--dark:#0b1020;--line:#2c3758}
}
body[data-theme=notebook]{background-image:repeating-linear-gradient(transparent 0 27px,var(--line) 27px 28px)}
body[data-theme=noir] .sus,body[data-theme=noir] .skimg{filter:grayscale(1) contrast(1.15)}
*{box-sizing:border-box}
html,body{margin:0;background-color:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh}
#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--dark);color:#fff;position:sticky;top:0;z-index:5}
.logo{font-family:var(--head);font-size:19px;letter-spacing:.5px}
.logo b{color:var(--accent);font-weight:400}
.hdr-r{display:flex;gap:8px;align-items:center}
.ib{background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:10px;min-width:40px;height:38px;font-size:17px}
.hcode{font-family:var(--head);color:var(--accent);font-size:16px;letter-spacing:2px}
main{padding:14px;flex:1;display:flex;flex-direction:column;gap:12px}
h2,h3{margin:0;font-family:var(--head);font-weight:400}
h2{font-size:26px}h3{font-size:19px}
.btn{appearance:none;border:0;border-radius:14px;padding:15px 18px;font-size:17px;font-weight:800;background:var(--accent);color:var(--accent-ink);width:100%;font-family:inherit;cursor:pointer}
.btn:active{transform:translateY(1px)}
.btn.dark{background:var(--dark);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.danger{background:#d32f2f;color:#fff}
.btn.sm{padding:10px 12px;font-size:15px;width:auto}
.btn:disabled{opacity:.45}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.center{text-align:center}
.muted{color:var(--muted)}.small{font-size:13px}
.row{display:flex;gap:8px;align-items:center}
.txt{width:100%;padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--ink);font-size:17px;font-family:inherit;outline:none}
.txt:focus{border-color:var(--accent)}
label.lbl{font-weight:700;font-size:14px;display:block;margin-bottom:6px}
.title{font-family:var(--head);font-size:46px;line-height:.92;margin:2px 0 0;text-align:center;font-weight:400}
.title span{color:var(--accent)}
.tag{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;background:var(--line);color:var(--ink)}
.tag.easy{background:#c8ecc9;color:#1b5e20}.tag.medium{background:#ffe08a;color:#5d4300}.tag.hard{background:#ffc2c2;color:#8e0000}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:8px 13px;font-size:14px;font-weight:700;font-family:inherit}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip:disabled{opacity:1}
.setrow{margin-top:10px}.setrow .muted{font-size:13px;font-weight:700;margin-bottom:5px}
.code{font-family:var(--head);font-size:52px;letter-spacing:8px;color:var(--accent);line-height:1.1}
.plist{list-style:none;margin:8px 0 0;padding:0}
.plist li{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line);font-weight:700}
.plist li:last-child{border-bottom:0}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.role{font-family:var(--head);font-size:17px;line-height:1.1}
.role small{display:block;font-family:system-ui,sans-serif;font-size:12px;color:var(--muted);font-weight:600}
.timer{font-family:var(--head);font-size:30px;min-width:64px;text-align:right}
.timer.hot{color:#d32f2f;animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.12)}}
.sus{width:100%;height:auto;display:block;border-radius:12px}
.cantsay{background:var(--dark);color:#fff;border-radius:14px;padding:12px;text-align:center}
.cs-h{font-family:var(--head);color:var(--accent);letter-spacing:1px;font-size:18px}
.word{display:inline-block;background:var(--accent);color:#fff;border-radius:8px;padding:5px 11px;margin:4px;font-weight:900;text-transform:uppercase;font-size:15px}
.crime{font-size:15px}.crime b{font-family:var(--head);font-weight:400;color:var(--accent)}
.board{position:relative;width:100%;aspect-ratio:300/360;border-radius:14px;overflow:hidden;touch-action:none;border:2px solid var(--line);background:#fbfaf6;user-select:none;-webkit-user-select:none}
.board canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.board.locked::after{content:"PENCILS DOWN";position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) rotate(-12deg);font-family:'Permanent Marker',cursive;font-size:34px;color:#d32f2f;border:4px solid #d32f2f;padding:4px 12px;border-radius:8px;background:rgba(255,255,255,.8)}
.tools{display:flex;gap:6px}
.tool{flex:1;height:48px;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--ink);font-weight:800;font-size:15px;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:4px}
.tool.on{border-color:var(--accent);background:var(--accent);color:#fff}
.sws{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.hexrow{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.cpick{width:46px;height:40px;border:2px solid var(--line);border-radius:10px;padding:2px;background:var(--panel)}
.hash{font-weight:800;font-size:18px;color:var(--muted)}
.hex{flex:1;min-width:0;padding:9px 10px;border-radius:10px;border:2px solid var(--line);background:var(--panel);color:var(--ink);font:800 17px ui-monospace,Menlo,monospace;letter-spacing:2px;text-transform:uppercase}
.hexerr{font-size:12px;color:#c62828;font-weight:700;min-width:48px}
.tool.col{flex:0 0 48px}
.cdot{width:24px;height:24px;border-radius:50%;border:2px solid rgba(0,0,0,.3);display:block;background:#111}
.pal{margin-top:-4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px}
.pal[hidden]{display:none}
.sw{aspect-ratio:1;border-radius:50%;border:2px solid rgba(0,0,0,.25);padding:0}
.sw.on{outline:3px solid var(--accent);outline-offset:2px}
.dot{display:inline-block;border-radius:50%;background:currentColor}
.clues{display:flex;flex-direction:column;gap:5px;max-height:136px;overflow:auto}
.clue{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 11px;font-size:16px;font-weight:600}
.clue.new{border:2px solid var(--accent)}
.chaos{background:#ffe08a;color:#3b2a00;border-radius:12px;padding:9px 11px;font-weight:800;font-size:14px}
.ready{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:rgba(0,0,0,.65);color:#fff;font-family:'Permanent Marker',cursive;font-size:26px;z-index:3;text-align:center}
.ready b{font-size:80px;color:var(--accent);font-weight:400;line-height:1}
.lineup{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lu{padding:4px;border-radius:14px;border:3px solid transparent;background:var(--panel);font-family:inherit;color:inherit}
.lu.on{border-color:var(--accent)}.lu.ok{border-color:#2e7d32}.lu.dim{opacity:.45}
.mine{display:flex;gap:10px;align-items:center}
.mine img{width:38%;border-radius:10px;border:2px solid var(--line)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.flip{perspective:1000px}
.fi{display:grid;transition:transform .9s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.flip.on .fi{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px;overflow:hidden}
.face.back{transform:rotateY(180deg)}
.face.front{background:var(--dark);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-family:'Permanent Marker',cursive;font-size:20px;aspect-ratio:200/240;padding:8px;border:3px dashed var(--accent)}
.face.front span{color:var(--accent);font-size:14px}
.skimg{width:100%;display:block;border-radius:12px;aspect-ratio:300/360;background:#fbfaf6}
.cap{font-size:13px;font-weight:800;margin-top:4px;text-align:center}
.ok{color:#2e7d32}.bad{color:#c62828}
.stamp{display:inline-block;font-family:'Permanent Marker',cursive;border:3px solid currentColor;border-radius:8px;padding:2px 8px;transform:rotate(-6deg);font-size:15px}
.score{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line);font-weight:700}
.score:last-child{border:0}
.titlecard{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line)}
.titlecard:last-child{border:0}
.titlecard .ic{font-size:26px}
.titlecard b{font-family:var(--head);font-weight:400;font-size:17px;color:var(--accent)}
.rap{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.rap img,.rap svg{width:100%;border-radius:8px}
.winner{background:var(--dark);color:#fff;border-radius:16px;padding:16px;text-align:center}
.winner .nm{font-family:var(--head);font-size:34px;color:var(--accent)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20}
#modal[hidden]{display:none}
.sheet{background:var(--panel);color:var(--ink);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:16px 16px 22px;max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.sheet img{width:100%;border-radius:12px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(140%);background:var(--dark);color:#fff;padding:12px 16px;border-radius:14px;font-weight:700;z-index:30;transition:transform .3s;max-width:92vw;text-align:center;border:2px solid var(--accent)}
#toast.on{transform:translateX(-50%) translateY(0)}
.hero{width:58%;margin:0 auto;transform:rotate(-3deg)}
.wait{display:flex;flex-direction:column;align-items:center;gap:10px;padding:30px 10px;text-align:center}
.spin{width:40px;height:40px;border-radius:50%;border:5px solid var(--line);border-top-color:var(--accent);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.th{border:2px solid var(--line);border-radius:12px;padding:12px;background:var(--panel);color:var(--ink);font-weight:800;font-family:inherit;text-align:left}
.th.on{border-color:var(--accent)}
.th small{display:block;color:var(--muted);font-weight:600}
.howto li{margin-bottom:6px}
.tip{background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:10px 12px;font-weight:700;font-size:14px;line-height:1.35}
.rtip{font-family:system-ui,sans-serif;font-size:15px;font-weight:700;max-width:80%;margin-top:14px;line-height:1.35}
.qr summary{font-family:var(--head);font-size:19px;cursor:pointer}
.err{color:#c62828;font-size:13px;font-weight:700;min-height:16px}
</style>
</head>
<body data-theme="mugshot">
<div id="app">
 <header class="top">
  <div class="logo">Doodle <b>Detectives</b></div>
  <div class="hdr-r"><span class="hcode" id="hcode"></span><button class="ib" id="snd" aria-label="Sound"></button><button class="ib" id="menu" aria-label="Menu">☰</button></div>
 </header>
 <main id="main"></main>
</div>
<div id="modal" hidden></div>
<div id="toast"></div>
<script>
'use strict';
/* ---------- utils ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function setH(el,h){if(!el)return false;if(el.__h===h)return false;el.__h=h;el.innerHTML=h;return true}
const LS={get(k,d){try{const v=localStorage.getItem('dd_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('dd_'+k,JSON.stringify(v))}catch(e){}}};
function rng(seed){let a=(seed>>>0)^0x9e3779b9;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
const pick=(r,a)=>a[Math.floor(r()*a.length)];
function shuffle(r,a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const f=v=>Math.max(0,Math.min(255,Math.round(v+(amt<0?v*amt:(255-v)*amt))));return'#'+[f(r),f(g),f(b)].map(v=>v.toString(16).padStart(2,'0')).join('')}
function vib(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
let toastT;function toast(t,ms=2600){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),ms)}

/* ---------- suspects ---------- */
const PACKS=[['classic','Classic'],['halloween','Halloween'],['office','Office'],['fantasy','Fantasy'],['animals','Animals']];
const SKINS=['#f6d3b3','#eabf98','#d29a6c','#a8704a','#6e4429'];
const HAIRC=['#2b1d14','#5a3a22','#a0522d','#e0b95a','#d9d4cc','#c0392b','#3d3d3d','#7b4dff'];
const PLAIN={hair:'short',eyes:'dots',brows:'normal',nose:'button',mouth:'smile',extra:'none',hat:'none',ears:'normal',outfit:'none',skin:'normal'};
const OPT={
 hair:[['bald','bald','Baldy'],['afro','afro','Fro'],['mohawk','mohawk','Mo'],['spiky','spikes','Spike'],['bun','bun','Bun'],['pigtails','pigtails','Pigtails'],['mullet','mullet','Mullet'],['beehive','beehive','Beehive'],['curly','curls','Curly'],['combover','combover','Combover'],['flattop','flat top','Flattop']],
 eyes:[['star','star','Starry'],['specs','glasses','Specs'],['shades','sunglasses','Shady'],['patch','eyepatch','Patch'],['googly','googly','Googly'],['sleepy','sleepy','Sleepy'],['monocle','monocle','Fancy']],
 brows:[['unibrow','unibrow','Unibrow'],['angry','angry','Grumpy'],['bushy','bushy','Bushy']],
 nose:[['big','nose','Schnozz'],['pointy','pointy','Pointy'],['snout','snout','Snoot','animals']],
 mouth:[['gap','gap','Gappy'],['onetooth','tooth','One-Tooth'],['braces','braces','Brace-Face'],['stache','mustache','Stache'],['beard','beard','Beardy'],['buck','buck teeth','Bucky'],['frown','frown','Frowny'],['tongue','tongue','Blep'],['fangs','fangs','Fang','halloween']],
 extra:[['freckles','freckles','Freckles'],['mole','mole','Moley'],['bandage','bandage','Band-Aid'],['earrings','earrings','Bling'],['scar','scar','Scratch'],['blush','blush','Rosy'],['stitches','stitches','Stitch','halloween'],['whiskers','whiskers','Whiskers','animals']],
 hat:[['beanie','beanie','Beanie'],['cap','cap','Cappy'],['tophat','top hat','Topper'],['party','party hat','Party'],['witch','witch','Witchy','halloween'],['horns','horns','Horns','fantasy|halloween'],['crown','crown','King','fantasy'],['wizard','wizard','Wizard','fantasy'],['catears','cat','Kitty','animals'],['bunny','bunny','Bun-Bun','animals'],['bearears','bear','Bear','animals'],['headset','headset','Headset','office'],['pencil','pencil','Pencil','office']],
 ears:[['bigears','ears','Jug-Ears'],['elf','elf','Elfie','fantasy']],
 outfit:[['tie','tie','Tie','office'],['badge','name tag','Name-Tag','office']],
 skin:[['green','green','Greenie','halloween']]
};
const CROOKS=['Bob','Mabel','Lou','Gus','Dot','Vinny','Bev','Sal','Pearl','Ozzie','Midge','Rocco','Dottie','Earl','Fern','Moe','Trixie','Hank','Gertie','Nico','Ruby','Stan','Peggy','Luigi','Bubba','Wanda','Clyde','Opal'];
const CRIMES=['stealing the office stapler','double-dipping at the nacho bar','putting the empty milk carton back','squeezing the toothpaste from the middle','hiding every TV remote in town','returning library books 40 years late','replacing the sugar with salt','eating a coworker\'s labeled lunch','spoiling the season finale','tickling a mime','honking at geese','feeding the ducks pizza','wearing socks with sandals to a wedding','kidnapping garden gnomes','hitting reply-all to 3,000 people','untying shoelaces at the bakery','moonwalking in a no-dance zone','sneaking a whole lasagna into the movies','teaching the parrot to sing off-key','microwaving fish at noon','egging the haunted house','eating all the candy corn','swapping the dragon\'s eggs with potatoes','chasing the mail carrier','stealing the last cookie','unplugging the office fridge','starting the conga line too early','putting pineapple on every pizza','using all the hot water','leaving one sip of juice in the jug','faking a sneeze to skip the bill','turning every clock 10 minutes fast','snoring in the library','losing the TV remote on purpose'];
function inPacks(o,packs){const p=(o[3]||'classic').split('|');return p.some(x=>x==='classic'||packs.includes(x))}
function avail(slot,packs){return OPT[slot].filter(o=>inPacks(o,packs))}
function genSuspect(seed,packs,diff){
 const r=rng(seed);packs=packs&&packs.length?packs:['classic'];
 const k=diff==='easy'?3:diff==='medium'?4:diff==='hard'?5:3+Math.floor(r()*3);
 const s={...PLAIN,skinTone:pick(r,SKINS),hairColor:pick(r,HAIRC),seed};
 const themed=packs.filter(p=>p!=='classic');
 let slots=shuffle(r,Object.keys(OPT));
 const notable=[];
 if(themed.length){const c=[];for(const sl of slots)for(const o of OPT[sl])if(o[3]&&o[3].split('|').some(p=>themed.includes(p)))c.push([sl,o]);
  if(c.length){const[sl,o]=pick(r,c);s[sl]=o[0];notable.push([sl,o]);slots=slots.filter(x=>x!==sl)}}
 for(const sl of slots){if(notable.length>=k)break;const av=avail(sl,packs);if(!av.length)continue;const o=pick(r,av);s[sl]=o[0];notable.push([sl,o])}
 s.notable=notable.map(n=>n[0]);
 const words=[];for(const[,o]of notable){if(!words.includes(o[1]))words.push(o[1]);if(words.length>=(k<=3?2:3))break}
 s.words=words;s.nick=notable[0][1][2]+' '+pick(r,CROOKS);s.crime=pick(r,CRIMES);
 s.diff=k<=3?'easy':k===4?'medium':'hard';return s;
}
function lineupFor(seed,packs,diff){
 const t=genSuspect(seed,packs,diff),r=rng(seed+777);
 const sig=x=>Object.keys(PLAIN).map(k=>x[k]).join(',');
 const seen=new Set([sig(t)]),out=[t];let g=0;
 while(out.length<4&&g++<300){

 <div class="setrow"><div class="muted">Mode</div>${chipRow('mode',[['comp','Competitive'],['coop','Co-op']])}</div>

 <div class="setrow"><div class="muted">Card packs</div>${chipRow('packs',PACKS,true)}</div>
 <div class="setrow"><div class="muted">Chaos rules (wrong hand, blind draw, one line)</div>${chipRow('chaos',[[true,'On'],[false,'Off']])}</div>`);
 if(IS_HOST&&setsChanged)$$('[data-set] .chip',$('#sets')).forEach(b=>b.onclick=()=>{const k=b.parentNode.dataset.set;let v=b.dataset.v;SFX.click();
  if(k==='time')v=+v;if(k==='chaos')v=v==='true';
  if(k==='packs'){const a=S.set.packs.slice();const i=a.indexOf(v);if(i>=0){if(v==='classic'&&a.length===1)return;a.splice(i,1)}else a.push(v);if(!a.length)a.push('classic');S.set.packs=a}else S.set[k]=v;bcast()});
 const n=pl.filter(([,P])=>!P.spec).length;
 if(setH($('#lobbybtn'),IS_HOST?`<button class="btn" id="go" ${n<2?'disabled':''}>${n<2?'Waiting for detectives…':'Start the case ▶'}</button>`:`<div class="wait" style="padding:10px"><div class="spin"></div><div class="muted">Waiting for the host to start…</div></div>`)){const g=$('#go');if(g)g.onclick=()=>{actx();startGame()}}
}

/* describe */
const CHAOS={wrong:'✋ Chaos rule: draw with your OTHER hand!',blind:'🙈 Chaos rule: blind draw! Your ink stays invisible until the lineup.',line:'〰️ Chaos rule: one continuous line! Lift your finger and you\'re done (undo to restart).'};
function tipOnce(key,seed,html){const k='tip_'+key,n=LS.get(k,0);if(n>=2&&LS.get(k+'_s',0)!==seed)return'';if(LS.get(k+'_s',0)!==seed){LS.set(k,n+1);LS.set(k+'_s',seed)}return html}
function cluesHTML(){const c=S.r.clues;if(!c.length)return`<div class="muted small">${role()==='wit'?'Type clues here if you\'re not in the same room.':'Clues from the Witness show up here.'}</div>`;return c.map((x,i)=>`<div class="clue${i===c.length-1?' new':''}">${esc(x)}</div>`).join('')}
function buildWitness(){
 const t=genSuspect(S.r.seed,S.r.pk,S.r.df);
 main.innerHTML=`${tipOnce('wit',S.r.seed,'<div class="tip">💡 You\'re the Witness! Describe this suspect so the artists can draw it, out loud or by typing below. Don\'t say the orange words!</div>')}<div class="bar"><div class="role">You're the WITNESS<small>Describe this suspect!</small></div><div class="timer" id="timer"></div></div>
 <div class="card" style="padding:8px">${suspectSVG(t)}<div class="row" style="justify-content:space-between;margin-top:8px"><div class="crime">Wanted for <b>${esc(t.crime)}</b></div><span class="tag ${t.diff}">${t.diff}</span></div></div>
 <div class="cantsay"><div class="cs-h">YOU CAN'T SAY</div>${t.words.map(w=>`<span class="word">${esc(w)}</span>`).join('')}</div>
 ${S.r.chaos?`<div class="chaos">Artists' ${CHAOS[S.r.chaos].replace(/^\S+ Chaos rule: /,'chaos rule: ')}</div>`:''}
 <div class="clues" id="clues"></div>
 <form id="cf" class="row"><input class="txt" id="clue" maxlength="70" placeholder="Type a clue…" autocomplete="off"><button class="btn sm" style="width:auto">Send</button></form>
 <div class="muted small center">In the same room? Just say it out loud.</div>`;
 $('#cf').onsubmit=e=>{e.preventDefault();const v=$('#clue').value.trim();if(!v)return;act({t:'clue',x:v});$('#clue').value=''};
}
function buildArtist(){
 const r=S.r;
 main.innerHTML=`<div class="bar"><div class="role">SKETCH ARTIST<small>Witness: ${esc((S.pl[r.wit]||{}).n)}</small></div><div class="timer" id="timer"></div></div>
 ${r.chaos?`<div class="chaos">${CHAOS[r.chaos]}</div>`:''}
 <div class="clues" id="clues"></div>
 <div class="board" id="board"></div>
 ${toolsHTML()}
 <button class="btn danger" id="bust">🚨 BUSTED! They said a forbidden word</button>`;
 BOARD=makeBoard($('#board'),{enabled:()=>S&&S.phase==='describe'&&S.r&&S.r.seed===r.seed&&drawWindow(),oneLine:()=>r.chaos==='line'});
 BOARD.seed=r.seed;$('#board').insertAdjacentHTML('beforeend',`<div class="ready" id="ready"><div>Get ready…</div><b id="rc">3</b>${tipOnce('art',r.seed,'<div class="rtip">💡 You\'re a Sketch Artist! Listen to the Witness and draw the suspect before time runs out. Hear a forbidden word? Hit BUSTED!</div>')}</div>`);
 if(r.chaos==='blind')BOARD.setInvisible(true);
 wireTools(main,BOARD);
 $('#bust').onclick=()=>modal(`<h3>🚨 Busted!</h3><p class="muted">Which forbidden word did the Witness say?</p><form id="bf" class="row"><input class="txt" id="bw" maxlength="24" placeholder="the word" autocomplete="off"><button class="btn sm danger">Bust</button></form><div class="err" id="berr"></div>`,sh=>{$('#bw',sh).focus();$('#bf',sh).onsubmit=e=>{e.preventDefault();const w=$('#bw',sh).value.trim();if(!w){$('#berr',sh).textContent='Type the word you heard';return}act({t:'bust',w});closeModal()}});
}
function buildSpectate(){main.innerHTML=`<div class="bar"><div class="role">CASE IN PROGRESS<small>${S.pl[ME]&&S.pl[ME].spec?'The room is full, so you\'re watching.':'You\'ll join at the next case.'}</small></div><div class="timer" id="timer"></div></div><div class="card center"><p>${esc((S.pl[S.r.wit]||{}).n)} is describing a suspect to the sketch artists.</p></div><div class="clues" id="clues"></div>${scoreHTML()}`}
function drawWindow(){const now=Date.now();return now<localEnd&&now>=localEnd-S.set.time*1000}
function updDescribe(){const c=$('#clues');if(c){const h=cluesHTML();if(c.dataset.h!==h){c.innerHTML=h;c.dataset.h=h;c.scrollTop=c.scrollHeight}}
 const b=$('#bust');if(b){const done=S.r.bust[ME]||((S.r.ba||{})[ME]||0)>=3;b.disabled=!!done;b.textContent=S.r.bust[ME]?'✅ You busted them!':done?'No busts left':'🚨 BUSTED! They said a forbidden word'}}

/* lineup */
function buildLineupArt(){
 const r=S.r,L=lineupFor(r.seed,r.pk,r.df);const mine=(SK[r.seed]||{})[ME]||(BOARD&&BOARD.seed===r.seed?BOARD.strokes:[]);
 main.innerHTML=`${tipOnce('lu',r.seed,'<div class="tip">💡 Which of these 4 did you draw? A right pick earns you +2 and the Witness +1.</div>')}<div class="bar"><div class="role">THE LINEUP<small>Which suspect did you draw?</small></div><div class="timer" id="timer"></div></div>
 <div class="mine"><img class="skimg" src="${sketchURL(mine)}" alt="Your sketch"><div><b>Your sketch</b><div class="muted small">Compare it to the lineup and pick your suspect.</div></div></div>
 <div class="lineup" id="lu">${L.list.map((s,i)=>`<button class="lu" data-i="${i}">${suspectSVG(s,{num:i+1})}</button>`).join('')}</div><div class="center muted" id="pm"></div>`;
 $$('.lu').forEach(b=>b.onclick=()=>{if(S.r.picks[ME]!=null)return;SFX.click();act({t:'pick',i:+b.dataset.i});LOCALPICK=+b.dataset.i;updLineup()});
}
let LOCALPICK=null;
function buildLineupWait(){main.innerHTML=`<div class="bar"><div class="role">THE LINEUP<small>Artists are studying 4 suspects…</small></div><div class="timer" id="timer"></div></div><div class="card"><ul class="plist" id="lw"></ul></div><div class="muted small center">Did you describe it well enough? We'll find out…</div>`}
function updLineup(){const r=S.r;
 const lu=$('#lu');if(lu){const p=r.picks[ME]!=null?r.picks[ME]:LOCALPICK;$$('.lu',lu).forEach(b=>{b.classList.toggle('on',+b.dataset.i===p);b.classList.toggle('dim',p!=null&&+b.dataset.i!==p)});$('#pm').textContent=p!=null?`You picked #${p+1}. Waiting for the others…`:''}
 setH($('#lw'),r.arts.map(p=>`<li><span>🕵️ ${esc((S.pl[p]||{}).n)}</span><span>${r.picks[p]!=null?'✅ picked':'🤔 thinking'}</span></li>`).join(''))}

/* reveal */
function revealCards(r,animate){
 const L=lineupFor(r.seed,r.pk,r.df),t=L.truth;
 const cards=[`<div class="flip${animate?'':' on'}"><div class="fi"><div class="face front">CLASSIFIED<span>the real suspect</span></div><div class="face back">${suspectSVG(t)}</div></div><div class="cap">${esc(t.nick)}</div></div>`];
 for(const p of r.arts){const st=(SK[r.seed]||{})[p];const n=(S.pl[p]||{}).n||'?';const ok=r.res[p];const pk=r.picks[p];
  const img=st?`<img class="skimg" src="${sketchURL(st,r.seed+'|'+p)}" alt="Sketch by ${esc(n)}">`:`<div class="skimg" style="display:flex;align-items:center;justify-content:center;color:#888;font-size:13px">${S.pl[p]&&S.pl[p].gone?'Sketch lost':'Developing photo…'}</div>`;
  cards.push(`<div class="flip${animate?'':' on'}"><div class="fi"><div class="face front">SKETCH<span>by ${esc(n)}</span></div><div class="face back">${img}</div></div>
  <div class="cap">${esc(n)} ${r.best===p?'⭐':''}</div><div class="cap ${ok?'ok':'bad'}">${pk==null?'No lineup pick':ok?`✔ Picked #${pk+1}: correct!`:`✘ Picked #${pk+1}, it was #${L.correct+1}`}</div>
  <div class="row" style="justify-content:center;gap:4px;margin-top:4px">${st?`<button class="btn sm ghost" data-share="${p}">Share</button>`:''}${role()==='wit'&&r.best==null&&r.arts.length>1?`<button class="btn sm" data-best="${p}">Best ⭐</button>`:''}</div></div>`)}
 return{html:cards.join(''),t};
}
function buildReveal(){
 const r=S.r,animate=REVEALED!==r.seed;REVEALED=r.seed;
 main.innerHTML=`<div class="bar"><div class="role">THE REVEAL<small>Case #${S.ri+1} of ${S.order.length}</small></div></div><div class="grid2" id="rv"></div><div class="center crime" id="rvc"></div><div id="rvbest"></div><div id="rvsc"></div><div id="rvbtn"></div>`;
 drawRevealCards(animate);
 if(animate){revealBusy=true;SFX.drum();vib([30,40,30,40,30]);const f=$$('.flip');setTimeout(()=>{f.forEach((el,i)=>setTimeout(()=>el.classList.add('on'),i*220));setTimeout(()=>{SFX.ding();revealBusy=false;softRefresh()},f.length*220+900)},1600)}
}
let lastRevealSig='';
function drawRevealCards(animate){const r=S.r;const{html,t}=revealCards(r,animate);$('#rv').innerHTML=html;$('#rvc').innerHTML=`Wanted for <b>${esc(t.crime)}</b>`;
 $$('[data-share]').forEach(b=>b.onclick=()=>shareCard(t,(SK[r.seed]||{})[b.dataset.share]||[],(S.pl[b.dataset.share]||{}).n));
 $$('[data-best]').forEach(b=>b.onclick=()=>{act({t:'best',p:b.dataset.best});SFX.ding()});
 lastRevealSig=revealSig()}
function revealSig(){const r=S.r;return JSON.stringify([r.best,r.res,Object.keys(SK[r.seed]||{}).length,r.arts.map(p=>S.pl[p]&&S.pl[p].gone)])}
function softRefresh(){if(PR)return;if(S&&S.phase==='reveal'&&VIEWKEY.startsWith('reveal|')&&!revealBusy&&revealSig()!==lastRevealSig)drawRevealCards(false);if(S&&S.phase==='end')render()}
function updReveal(){const r=S.r;if(!revealBusy&&revealSig()!==lastRevealSig)drawRevealCards(false);
 setH($('#rvbest'),r.arts.length>1?`<div class="center muted small">${r.best?`⭐ The Witness picked <b>${esc((S.pl[r.best]||{}).n)}</b>'s sketch as the best${S.set.mode==='comp'?' (+2)':''}`:role()==='wit'?'Tap <b>Best ⭐</b> on your favorite sketch.':'Waiting for the Witness to pick the best sketch…'}</div>`:'');
 setH($('#rvsc'),scoreHTML());
 const last=S.ri+1>=S.order.length;
 if(setH($('#rvbtn'),IS_HOST?`<button class="btn" id="nx">${last?'Close the case file 📁':'Next case ▶'}</button>`:`<div class="muted center small">Waiting for the host…</div>`)){const nx=$('#nx');if(nx)nx.onclick=()=>{SFX.click();if(S.phase==='reveal')nextRound()}}}
function scoreHTML(){if(S.set.mode==='coop')return `<div class="card center"><div class="muted small" style="font-weight:800">TEAM SCORE</div><div class="code" style="font-size:40px;letter-spacing:2px">${S.team}</div><div class="muted small">${S.solved}/${S.cases} lineups solved</div></div>`;
 const pl=Object.entries(S.pl).filter(([,P])=>!P.spec).sort((a,b)=>b[1].s-a[1].s);
 return `<div class="card"><h3>Scoreboard</h3>${pl.map(([p,P])=>`<div class="score"><span>${esc(P.n)}${p===ME?' (you)':''}${P.gone?' 👋':''}</span><span>${P.s}</span></div>`).join('')}</div>`}

/* end */
function buildEnd(){
 const pl=Object.entries(S.pl).filter(([,P])=>!P.spec&&!P.wait);
 const top=(f)=>{let m=-1e9;for(const[,P]of pl)m=Math.max(m,f(P));if(m<=0)return null;return pl.filter(([,P])=>f(P)===m).map(([,P])=>P.n).join(' & ')};
 const sorted=pl.slice().sort((a,b)=>b[1].s-a[1].s);
 const titles=[['🎨','Most Wanted Artist',top(P=>P.a)],['🗣️','Star Witness',top(P=>P.w)],['🔎','Eagle Eye',top(P=>P.e)],['🤐','Loose Lips',top(P=>P.b)]].filter(t=>t[2]);
 const coop=S.set.mode==='coop';
 const hist=Object.values(HIST).sort((a,b)=>a.ri-b.ri);
 main.innerHTML=`<h2 class="center">Case closed!</h2>
 <div class="winner">${coop?`<div class="muted small" style="color:#ccc">TEAM SCORE</div><div class="nm">${S.team} pts</div><div>${S.solved}/${S.cases} lineups solved. ${S.cases&&S.solved/S.cases>=.7?'Top-notch detective work!':'The crooks got away with a few…'}</div>`:`<div class="muted small" style="color:#ccc">${top(P=>P.s+1000)&&top(P=>P.s+1000).includes(' & ')?'IT\'S A TIE!':'CHIEF DETECTIVE'}</div><div class="nm">${esc(top(P=>P.s+1000)||'?')}</div><div>${sorted[0]?sorted[0][1].s:0} points</div>`}</div>
 ${titles.length?`<div class="card"><h3>Awards</h3>${titles.map(t=>`<div class="titlecard"><span class="ic">${t[0]}</span><div><b>${t[1]}</b><div>${esc(t[2])}</div></div></div>`).join('')}</div>`:''}
 ${coop?'':scoreHTML()}
 <div class="card"><h3>Rap sheet</h3><div class="muted small">Every suspect and every sketch. Tap a sketch to share it.</div>${hist.map(h=>{const t=genSuspect(h.seed,h.pk,h.df);return `<div style="margin-top:10px"><div class="small" style="font-weight:800">${esc(t.nick)} <span class="muted">· witness ${esc(h.wit)}</span></div><div class="rap">${suspectSVG(t)}${h.arts.map(a=>{const st=(SK[h.seed]||{})[a.p];return st?`<img class="skimg" data-hs="${h.seed}" data-hp="${a.p}" src="${sketchURL(st,h.seed+'|'+a.p)}" alt="Sketch by ${esc(a.n)}">`:''}).join('')}</div></div>`}).join('')||'<div class="muted">No cases recorded.</div>'}</div>
 <div id="unl"></div>
 ${IS_HOST?'<button class="btn" id="again">Play again</button>':'<div class="muted center small">The host can start a new game.</div>'}
 <button class="btn ghost" id="lv">Leave room</button>`;
 $$('[data-hs]').forEach(im=>im.onclick=()=>{const h=HIST[im.dataset.hs];shareCard(genSuspect(h.seed,h.pk,h.df),SK[h.seed][im.dataset.hp],(S.pl[im.dataset.hp]||{}).n)});
 const a=$('#again');if(a)a.onclick=playAgain;$('#lv').onclick=leaveGame;
 const ek=CODE+'|'+S.order.join(',');if(ENDCOUNTED!==ek){ENDCOUNTED=ek;countGame()}
}
function countGame(){const g=LS.get('games',0)+1;LS.set('games',g);const u=THEMES.find(t=>t[2]===g);if(u)setTimeout(()=>toast(`🔓 Unlocked the ${u[1]} style! Find it in the ☰ menu.`,4200),1200)}

/* timers */
let lastSec=-1;
setInterval(()=>{
 if(PR){practiceTick();return}
 if(!S||!S.r)return;const el=$('#timer');const now=Date.now();
 if(S.phase==='describe'){const draw=S.set.time*1000;const rem=localEnd-now;const rd=$('#ready');
  if(rem>draw){const c=Math.ceil((rem-draw)/1000);if(el)el.textContent='';if(rd){rd.style.display='flex';$('#rc').textContent=c}if(c!==lastSec){lastSec=c;SFX.tick()}}
  else{if(rd)rd.style.display='none';const s=Math.max(0,Math.ceil(rem/1000));if(el){el.textContent=s+'s';el.classList.toggle('hot',s<=5)}
   if(s!==lastSec){lastSec=s;if(s<=5&&s>0){SFX.tick();if(role()==='art')vib(60)}}
   const bd=$('#board');if(bd)bd.classList.toggle('locked',rem<=0)}}
 else if(S.phase==='lineup'){const s=Math.max(0,Math.ceil((localEnd-now)/1000));if(el){el.textContent=s+'s';el.classList.toggle('hot',s<=5)}}
},200);

/* ---------- practice (solo) ---------- */
let PR=null;
function startPractice(){actx();const seed=(Math.random()*2e9)|0;PR={seed,phase:'memo',end:Date.now()+8000,pk:['classic','halloween','office','fantasy','animals'],df:'mix',pick:null,board:null};VIEWKEY='';render()}
function renderPractice(){
 const P=PR,key='pr|'+P.phase+'|'+P.seed;
 if(VIEWKEY===key)return;VIEWKEY=key;main.innerHTML='';
 const L=lineupFor(P.seed,P.pk,P.df);
 if(P.phase==='memo'){music('lobby');main.innerHTML=`<div class="bar"><div class="role">PRACTICE<small>Memorize this suspect!</small></div><div class="timer" id="timer"></div></div><div class="card" style="padding:8px">${suspectSVG(L.truth,{placard:false})}</div><div class="muted center">In a moment it disappears and you'll sketch it from memory.</div><button class="btn ghost" id="skip">I've got it, let me draw</button>`;$('#skip').onclick=()=>{P.end=Date.now()}}
 else if(P.phase==='draw'){music('draw');SFX.start();main.innerHTML=`<div class="bar"><div class="role">PRACTICE<small>Draw it from memory</small></div><div class="timer" id="timer"></div></div><div class="board" id="board"></div>${toolsHTML()}<button class="btn" id="done">Done drawing</button>`;P.board=makeBoard($('#board'),{enabled:()=>PR&&PR.phase==='draw'});wireTools(main,P.board);$('#done').onclick=()=>{P.end=Date.now()}}
 else if(P.phase==='lineup'){music(null);SFX.buzz();main.innerHTML=`<div class="bar"><div class="role">THE LINEUP<small>Which one did you draw?</small></div></div><div class="mine"><img class="skimg" src="${sketchURL(P.board.strokes)}" alt="Your sketch"><div class="muted small">Pick the suspect you drew.</div></div><div class="lineup">${L.list.map((s,i)=>`<button class="lu" data-i="${i}">${suspectSVG(s,{num:i+1})}</button>`).join('')}</div>`;
  $$('.lu').forEach(b=>b.onclick=()=>{P.pick=+b.dataset.i;P.phase='reveal';render()})}
 else if(P.phase==='reveal'){const ok=P.pick===L.correct;main.innerHTML=`<div class="bar"><div class="role">THE REVEAL</div></div><div class="grid2"><div class="flip"><div class="fi"><div class="face front">CLASSIFIED</div><div class="face back">${suspectSVG(L.truth)}</div></div></div><div class="flip"><div class="fi"><div class="face front">YOUR<span>sketch</span></div><div class="face back"><img class="skimg" src="${sketchURL(P.board.strokes)}" alt="Your sketch"></div></div></div></div>
  <div class="center" id="res" style="opacity:0;transition:opacity .4s"><span class="stamp ${ok?'ok':'bad'}">${ok?'CASE SOLVED':'WRONG SUSPECT'}</span><div class="muted small" style="margin-top:6px">You picked #${P.pick+1}${ok?'':`; it was #${L.correct+1}`}. Wanted for ${esc(L.truth.crime)}.</div></div>
  <button class="btn ghost" id="sh">Share</button><button class="btn" id="ag">Another suspect</button><button class="btn ghost" id="hm">Home</button>`;
  SFX.drum();setTimeout(()=>{$$('.flip').forEach((f,i)=>setTimeout(()=>f.classList.add('on'),i*250));setTimeout(()=>{ok?SFX.ding():SFX.wrong();$('#res').style.opacity=1},900)},1600);
  $('#sh').onclick=()=>shareCard(L.truth,P.board.strokes,NAME||'you');$('#ag').onclick=startPractice;$('#hm').onclick=()=>{PR=null;VIEWKEY='';music(null);render()}}
}
function practiceTick(){const P=PR,el=$('#timer'),now=Date.now();if(!el&&P.phase!=='memo'&&P.phase!=='draw')return;const s=Math.max(0,Math.ceil((P.end-now)/1000));if(el){el.textContent=s+'s';el.classList.toggle('hot',s<=5)}
 if(s!==lastSec){lastSec=s;if(s<=5&&s>0)SFX.tick()}
 if(now>=P.end){if(P.phase==='memo'){P.phase='draw';P.end=now+30000;render()}else if(P.phase==='draw'){P.phase='lineup';render()}}}

render();
</script>
